version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-todo-app:latest
    container_name: flask-todo-monitoring
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"  # Port pour les métriques Prometheus
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - PORT=8080
      - METRICS_PORT=9090
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/app.log
      - APP_VERSION=1.0.0
      # Décommentez et remplissez ces variables pour l'intégration avec Grafana Cloud
      # - GRAFANA_USER_ID=your_user_id
      # - GRAFANA_API_KEY=your_api_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-monitoring
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-monitoring
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Changez ceci en production!
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki-monitoring
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail-monitoring
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/app
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
      - app

volumes:
  prometheus_data:
  grafana_data:
  loki_data: