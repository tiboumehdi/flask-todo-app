version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-todo-app
    container_name: flask-todo
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - FLASK_ENV=production
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/data/todo.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge