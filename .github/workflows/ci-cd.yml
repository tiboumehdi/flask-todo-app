ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          
      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint
        
      - name: Generate ansible-lint report
        if: always()
        run: |
          cd ansible
          ansible-lint -f json -o ansible-lint-report.json || true
          
      - name: Upload ansible-lint report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ansible-lint-report
          path: ansible/ansible-lint-report.jsonname: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Analyse hebdomadaire (tous les dimanches à minuit)
  workflow_dispatch:  # Permet le déclenchement manuel

# Environnements disponibles
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ANSIBLE_PLAYBOOK_REPO: votre-nom-utilisateur/ansible-playbooks
  ANSIBLE_PLAYBOOK_NAME: flask-todo-deploy.yml

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Récupère tout l'historique pour les outils de qualité
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-flask pytest-cov black isort
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
      
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check code formatting with Black
      run: |
        black --check --diff .
        
    - name: Check import order with isort
      run: |
        isort --check-only --profile black .
        
    - name: Run tests with pytest
      run: |
        pytest --cov=. --cov-report=xml
        
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
        
    - name: Upload test results as artifact
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: coverage.xml

  security:
    name: Security Analysis
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      # SAST - CodeQL Analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python
          queries: security-and-quality
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:python"
      
      # SAST - SonarCloud Analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=votre-nom-utilisateur_flask-todo-app
            -Dsonar.organization=votre-nom-utilisateur-github
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
            -Dsonar.tests=tests/
            -Dsonar.python.xunit.reportPath=test-results.xml
      
      # SAST - Bandit Analysis
      - name: Set up Python for security tools
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep
          
      - name: Run bandit
        run: |
          bandit -r . -f sarif -o bandit-results.sarif -x ./tests,./venv || true
          
      - name: Upload Bandit report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: bandit-results.sarif
          category: bandit
          
      # SAST - Semgrep Analysis
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          output: semgrep-results.sarif
          
      - name: Upload Semgrep report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # SCA - OWASP Dependency-Check
      - name: Set up Java for OWASP Dependency-Check
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'flask-todo-app'
          path: '.'
          format: 'ALL'
          out: 'reports'
          args: >
            --enableExperimental
            --scan .
            
      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: reports
      
      # SCA - Safety Analysis
      - name: Install safety
        run: pip install safety
        
      - name: Check for vulnerabilities in dependencies
        run: |
          safety check -r requirements.txt --json > safety-report.json || true
          
      - name: Upload Safety report
        uses: actions/upload-artifact@v3
        with:
          name: safety-report
          path: safety-report.json
          
      # SCA - pip-audit Analysis
      - name: Install pip-audit
        run: pip install pip-audit
        
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
          
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v3
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  container-scan:
    name: Container Security Scan
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      # Build Docker image for scanning
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: flask-todo-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Trivy - Container vulnerability scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flask-todo-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
          
      # Dockle - Container linter
      - name: Run Dockle
        uses: goodwithtech/dockle-action@v0.1.0
        with:
          image: flask-todo-app:${{ github.sha }}
          format: 'sarif'
          output: 'dockle-results.sarif'
          exit-code: '1'
        continue-on-error: true
        
      - name: Upload Dockle results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'dockle-results.sarif'
          category: 'dockle'
      
      # Snyk - Container security
      - name: Run Snyk to check for container vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: flask-todo-app:${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high --sarif-file-output=snyk-container-results.sarif
        continue-on-error: true

      - name: Upload Snyk container scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: snyk-container-results.sarif
          category: 'snyk-container'
  
  package:
    name: Build and Push Docker Image
    needs: [build, security, container-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,format=short
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Flask Todo App
          org.opencontainers.image.description=Flask Todo App with Docker and Security
          org.opencontainers.image.vendor=Your Organization
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
    
    # Create a GitHub Release for tagged versions
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        
    # Store environment-specific variables for deployment
    - name: Create deployment variables
      id: deployment_vars
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "environment=staging" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    # Save deployment info as artifact for the deploy job
    - name: Save deployment info
      run: |
        echo "REGISTRY=${{ env.REGISTRY }}" > deployment-info.env
        echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" >> deployment-info.env
        echo "IMAGE_TAG=${{ steps.deployment_vars.outputs.image_tag }}" >> deployment-info.env
        echo "ENVIRONMENT=${{ steps.deployment_vars.outputs.environment }}" >> deployment-info.env
        echo "GITHUB_SHA=${{ github.sha }}" >> deployment-info.env
        
    - name: Upload deployment info
      uses: actions/upload-artifact@v3
      with:
        name: deployment-info
        path: deployment-info.env

  deploy:
    name: Deploy with Ansible
    needs: [package, ansible-lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
    - name: Download deployment info
      uses: actions/download-artifact@v3
      with:
        name: deployment-info
        
    - name: Set environment variables from artifact
      run: |
        cat deployment-info.env >> $GITHUB_ENV
        
    - name: Checkout Ansible Playbooks
      uses: actions/checkout@v3
      with:
        repository: ${{ env.ANSIBLE_PLAYBOOK_REPO }}
        token: ${{ secrets.ANSIBLE_REPO_TOKEN }}
        path: ansible-playbooks
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Ansible
      run: |
        python -m pip install --upgrade pip
        pip install ansible
        
    # Méthode 1: SSH depuis le runner GitHub Actions
    - name: Set up SSH key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
        
    - name: Add host key to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
        
    - name: Create Ansible Vault password file
      run: |
        echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
        chmod 600 .vault_pass
      working-directory: ansible-playbooks
        
    - name: Run Ansible playbook via SSH
      run: |
        cd ansible-playbooks
        export ANSIBLE_HOST_KEY_CHECKING=False
        ansible-playbook ${{ env.ANSIBLE_PLAYBOOK_NAME }} \
          -i inventories/${{ env.ENVIRONMENT }}.yml \
          -e "flask_todo_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
          -e "flask_todo_version=${{ github.sha }}" \
          -e "environment=${{ env.ENVIRONMENT }}" \
          --vault-password-file=.vault_pass

