  notify:
    name: Send Notifications
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check build status
      id: status
      run: |
        if [[ "${{ needs.build.result }}" == "success" && "${{ needs.security.result }}" == "success" && \
              "${{ needs.container-scan.result }}" == "success" && "${{ needs.package.result }}" == "success" && \
              "${{ needs.deploy.result }}" == "success" ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "status_message=✅ Pipeline completed successfully" >> $GITHUB_OUTPUT
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "status_message=❌ Pipeline failed" >> $GITHUB_OUTPUT
        fi
        
    # Slack notification (exemple, nécessite un webhook Slack configuré)
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ steps.status.outputs.success == 'true' && 'success' || 'failure' }}
        fields: repo,message,commit,author,action,eventName,workflow
        text: "${{ steps.status.outputs.status_message }} for ${{ github.repository }} (${{ github.ref_name }})"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      continue-on-error: true
 >> security-report.md
          
          echo "## Dependency Vulnerabilities" >> security-report.md
          echo "See the safety-report and pip-audit-report for details." >> security-report.md
          echo "" >> security-report.md
          
          echo "## Container Security" >> security-report.md
          echo "See the Trivy, Dockle, and Grype results for details." >> security-report.md
          echo "" >> security-report.md
          
          echo "## Code Security" >> security-report.md
          echo "Review the CodeQL, Bandit, and Semgrep results in the GitHub Security tab." >> security-report.md
          
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.md