---
# Inventory for staging environment
# File: ansible/inventories/staging.yml

all:
  vars:
    ansible_user: deploy
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_become: yes
    ansible_become_method: sudo
    environment: staging
    enable_monitoring: true
    enable_backup: false
    public_port: 8080
    memory_limit: "512m"
    cpu_limit: "0.5"

flask_todo_servers:
  hosts:
    staging-app-1:
      ansible_host: staging-app.example.com
      ansible_port: 22
  vars:
    flask_todo_image: "ghcr.io/votre-nom-utilisateur/flask-todo-app:develop"
    network_name: "staging_network"